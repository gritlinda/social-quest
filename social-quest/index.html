<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사회 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
</style>
<style>
/* Layout: 한 화면 앱. 홈(탐험 지도) → 개념 카드 → 퀴즈 → 오답 재도전 → 결과. 밝은 단일 테마 */
:root{
 --sky:#e9f4ff; --ink:#1d2a4a; --muted:#5d6b8a; --card:#ffffff; --line:#d7e4f5;
 --blue:#3d7bff; --blue-d:#2556c9; --sun:#ffc531; --sun-d:#e0a500; --coral:#ff6b6b; --coral-d:#d94848;
 --mint:#23c483; --mint-d:#169866; --grape:#8b5cf6; --grape-d:#6a3fd6;
 --f-disp:'Jua','Gothic A1',system-ui,sans-serif; --f-body:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
 color-scheme:light;
}
html,body{height:100%}
body{word-break:keep-all;overflow-wrap:anywhere;background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:14px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,.disp{font-family:var(--f-disp);font-weight:400;letter-spacing:.2px;text-wrap:balance;margin:0}
/* 3D 버튼 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:16px;font-family:var(--f-disp);font-size:20px;color:#fff;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}
.btn.sun{background:var(--sun);color:#4a3400;box-shadow:0 5px 0 var(--sun-d)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.btn.coral{background:var(--coral);box-shadow:0 5px 0 var(--coral-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn[disabled]{background:#cfd8e6;box-shadow:0 5px 0 #b3bfd2;color:#fff;cursor:not-allowed}
/* 상단 */
.top{display:flex;align-items:center;gap:10px}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.chip .ic{font-size:18px}
.spacer{flex:1}
.icobtn{width:42px;height:42px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:20px;display:grid;place-items:center}
/* 히어로 */
.hero{background:linear-gradient(135deg,#3d7bff 0%,#7b5cff 100%);border-radius:24px;color:#fff;padding:18px;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .txt{flex:1;min-width:0;position:relative;z-index:1}
.hero h1{font-size:26px;line-height:1.15}
.hero p{margin:4px 0 10px;font-size:14px;opacity:.92}
.lvbar{height:12px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.lvtxt{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}
.mascot{width:86px;height:86px;flex:0 0 auto;position:relative;z-index:1}
/* 탭 */
.tabs{display:flex;background:#fff;border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.tabs button{flex:1;padding:10px;border-radius:12px;font-weight:800;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff}
/* 지도 */
.unit{background:#fff;border-radius:22px;border:2px solid var(--line);padding:16px 14px 20px}
.unit-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.unit-h .tag{font-family:var(--f-disp);font-size:13px;color:#fff;padding:3px 10px;border-radius:99px}
.unit-h h2{font-size:21px}
.unit-h .cnt{margin-left:auto;font-weight:800;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;width:200px;position:relative}
.node .bub{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--c);box-shadow:0 6px 0 var(--cd), inset 0 -6px 0 rgba(0,0,0,.08);transition:transform .1s}
.node:active .bub{transform:translateY(4px);box-shadow:0 2px 0 var(--cd)}
.node.lock .bub{background:#dfe6f1;box-shadow:0 6px 0 #c3cede;filter:grayscale(1);opacity:.7}
.node.cur .bub{animation:bob 1.6s ease-in-out infinite}
.node .nm{font-weight:800;font-size:14px;text-align:center;line-height:1.3}
.node.lock .nm{color:#9aa6bd}
.node .stars{font-size:15px;letter-spacing:1px;min-height:18px}
.node .start{position:absolute;top:-14px;z-index:2;background:var(--ink);color:#fff;font-size:12px;font-weight:800;padding:3px 9px;border-radius:9px;white-space:nowrap}
.node:nth-child(4n+2){transform:translateX(52px)}.node:nth-child(4n+4){transform:translateX(-52px)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* 학습 화면 */
.bar{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:16px;background:#d9e4f3;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.1)}
.x{font-size:26px;color:var(--muted);width:36px;height:36px}
.stage{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;font-family:var(--f-disp);font-size:15px;color:#fff;padding:5px 12px;border-radius:99px}
.panel{background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px}
.qtitle{font-size:23px;line-height:1.35}
.concept h3{font-size:22px;margin-bottom:12px;color:var(--blue-d)}
.concept ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.concept li{line-height:1.95;font-size:16.5px;padding-left:26px;position:relative}
.concept li::before{content:"";position:absolute;left:4px;top:11px;width:10px;height:10px;border-radius:3px;background:var(--sun);transform:rotate(45deg)}
.blank{display:inline-block;min-width:76px;padding:0 10px;margin:0 2px;border-radius:9px;background:var(--grape);color:transparent;font-weight:800;line-height:1.55;box-shadow:0 3px 0 var(--grape-d);vertical-align:1px;user-select:none;position:relative}
.blank::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:var(--f-disp);font-size:15px}
.blank.open{background:#fff3c7;color:#7a4b00;box-shadow:0 3px 0 #f1d27a;animation:pop .3s}
.blank.open::after{content:none}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.hint{font-size:13.5px;color:var(--muted);font-weight:600;text-align:center}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:#cbd7ea}.dots i.on{background:var(--blue);width:22px;border-radius:9px}
/* 문제 */
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 14px;border-radius:16px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:17px;font-weight:600;line-height:1.4}
.opt .k{flex:0 0 auto;width:32px;height:32px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-disp);font-size:16px;color:var(--muted)}
.opt.sel{border-color:var(--blue);box-shadow:0 4px 0 var(--blue);background:#eef4ff}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.good{border-color:var(--mint);box-shadow:0 4px 0 var(--mint-d);background:#e6fbf2}
.opt.bad{border-color:var(--coral);box-shadow:0 4px 0 var(--coral-d);background:#fff0f0;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ox .opt{justify-content:center;flex-direction:column;padding:22px 10px;font-family:var(--f-disp);font-size:54px;line-height:1}
.ox .opt small{font-size:15px;font-family:var(--f-body);font-weight:800;color:var(--muted)}
.ox .o{color:var(--blue)}.ox .xx{color:var(--coral)}
.qtag{display:flex;gap:8px;align-items:center;font-weight:800;color:var(--muted);font-size:14px}
.qtag .b{background:var(--ink);color:#fff;padding:3px 9px;border-radius:8px}
.combo{margin-left:auto;color:var(--coral-d);font-family:var(--f-disp);font-size:17px}
/* 피드백 시트 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .25s ease-out}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet.good{background:#d7f8e8}.sheet.bad{background:#ffe1e1}
.sheet h3{font-size:21px}.sheet.good h3{color:var(--mint-d)}.sheet.bad h3{color:var(--coral-d)}
.sheet p{margin:0;font-weight:600;line-height:1.55;font-size:15.5px}
.sheet .ans{font-weight:800}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.padbot{height:170px}
/* 결과 */
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.bigstars{font-size:52px;letter-spacing:6px}
.bigstars span{display:inline-block;animation:pop .5s backwards}
.bigstars .off{filter:grayscale(1);opacity:.3}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 6px}
.stat b{display:block;font-family:var(--f-disp);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;font-weight:800;color:var(--muted)}
.retry-note{background:#fff4d6;border:2px dashed var(--sun-d);border-radius:16px;padding:14px;font-weight:700;line-height:1.5;color:#6b4a00}
/* 오답 노트 */
.wn{display:flex;flex-direction:column;gap:10px}
.wn .it{background:#fff;border:2px solid var(--line);border-left:6px solid var(--coral);border-radius:14px;padding:12px 14px}
.wn .it small{font-weight:800;color:var(--muted)}
.wn .it p{margin:4px 0;font-weight:700;line-height:1.45}
.wn .it .a{color:var(--mint-d);font-weight:800}
.empty{text-align:center;color:var(--muted);font-weight:700;padding:30px 10px;line-height:1.6}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(20,30,60,.45);display:grid;place-items:center;z-index:30;padding:20px}
.modal .box{background:#fff;border-radius:22px;padding:22px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--f-disp);font-size:18px;padding:10px 18px;border-radius:99px;z-index:40;animation:pop .3s;white-space:nowrap}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:35}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.node:nth-child(4n+2){transform:translateX(30px)}.node:nth-child(4n+4){transform:translateX(-30px)}.qtitle{font-size:21px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<canvas class="confetti" id="cf" hidden></canvas>
<script>
// [[답]] = 학습 카드에서 탭해서 여는 빈칸
// 문제: t:'mc'(보기 a = 정답 번호), t:'ox'(a = true/false)
const UNITS = [
 { id:'am', name:'V. 아메리카', sub:'아메리카 대륙 탐험', chapters:[
  { id:'c1', title:'아메리카의 국가와 주요 도시', q:'아메리카의 국가와 주요 도시의 위치는 어디일까?', icon:'🗺️',
    cards:[
     {h:'지역 구분 두 가지', b:['지리적으로 [[파나마 지협]]을 경계로 [[북아메리카]]와 [[남아메리카]]로 나눠요.','문화적으로 [[리오그란데강]]을 기준으로 [[앵글로아메리카]]와 [[라틴 아메리카]]로 나눠요.','지협: 두 육지를 이어 주는 좁고 잘록한 땅']},
     {h:'주요 국가', b:['북아메리카: 캐나다, 미국, [[멕시코]], 카리브해 연안 국가들','남아메리카: 브라질, 아르헨티나, 콜롬비아, 페루, 칠레 등']},
     {h:'캐나다·미국의 도시', b:['[[토론토]]: 캐나다의 정치·경제·문화 중심지, 인구 50% 이상이 이민자','[[몬트리올]]: 프랑스 문화가 발달, 다양한 국제 행사','[[뉴욕]]: 월가, 국제 연합(UN) 본부가 있는 세계 경제 중심','[[로스앤젤레스]]: 다양한 문화 산업','[[시카고]]: 과거 공업 발달로 성장','[[휴스턴]]: 석유 산업과 항공 우주 산업']},
     {h:'고대 문명 도시와 생태 도시', b:['[[멕시코시티]]: 멕시코의 수도, 해발 약 2,200m, 아스테카 문명의 중심지','[[쿠스코]]: 페루, 잉카 문명의 유산','생태 도시: [[쿠리치바]](브라질), 아바나(쿠바)','[[상파울루]]: 남아메리카에서 인구가 가장 많은 금융 중심지']}
    ],
    quiz:[
     {t:'mc',q:'북아메리카와 남아메리카를 나누는 지리적 경계는?',o:['리오그란데강','파나마 지협','아마존강','로키산맥'],a:1,e:'지리적으로는 파나마 지협, 문화적으로는 리오그란데강이 기준이에요.'},
     {t:'mc',q:'앵글로아메리카와 라틴 아메리카를 나누는 문화적 기준은?',o:['미시시피강','파나마 지협','리오그란데강','안데스산맥'],a:2,e:'미국과 멕시코 국경을 흐르는 리오그란데강이 문화적 경계예요.'},
     {t:'mc',q:'다음 중 앵글로아메리카에 속하는 나라는?',o:['멕시코','칠레','캐나다','브라질'],a:2,e:'앵글로아메리카는 미국과 캐나다예요.'},
     {t:'mc',q:'월가를 중심으로 세계 경제 중심 역할을 하고, UN 본부가 있는 도시는?',o:['시카고','뉴욕','휴스턴','토론토'],a:1,e:'뉴욕은 미국에서 인구가 가장 많은 세계 금융 중심지예요.'},
     {t:'mc',q:'해발 약 2,200m에 있고, 아스테카 문명의 중심지였던 멕시코의 수도는?',o:['쿠스코','멕시코시티','아바나','쿠리치바'],a:1,e:'쿠스코는 잉카 문명, 멕시코시티는 아스테카 문명이에요.'},
     {t:'ox',q:'몬트리올은 프랑스 문화가 발달한 캐나다의 도시이다.',a:true,e:'몬트리올은 프랑스어를 쓰는 퀘벡주에 있어요.'},
     {t:'ox',q:'휴스턴은 다양한 문화 산업으로 유명한 도시이다.',a:false,e:'문화 산업은 로스앤젤레스! 휴스턴은 석유와 항공 우주 산업이에요.'},
     {t:'mc',q:'남아메리카에서 인구가 가장 많고 금융의 중심인 도시는?',o:['쿠스코','상파울루','아바나','몬트리올'],a:1,e:'브라질의 상파울루예요.'}
    ]},
  { id:'c2', title:'아메리카의 지형', q:'아메리카의 자연환경 특성은 어떠할까? ①', icon:'⛰️',
    cards:[
     {h:'지형의 큰 특징', b:['대륙의 [[서쪽]]에는 높고 험준한 산지가 있어요.','[[동쪽]]에는 오랜 기간 [[침식]]을 받은 낮은 산지나 고원이 있어요.']},
     {h:'북아메리카', b:['서쪽: [[로키산맥]]이 남북으로 뻗어 있어요.','동쪽: [[애팔래치아산맥]]','가운데: 대평원과 남북으로 흐르는 [[미시시피강]]','그랜드캐니언: [[강의 침식]]으로 생긴 협곡, 세계 자연 유산']},
     {h:'남아메리카', b:['서쪽: [[안데스산맥]]이 남북으로 뻗어 있어요.','동쪽: [[브라질 고원]]','가운데: [[아마존강]]이 흐르는 아마존 분지, 세계 최대 열대림 = 지구의 허파','[[우유니 사막]]: 고산 지대의 소금 사막, 세계적인 리튬 매장지']}
    ],
    quiz:[

const COLORS=[['#3d7bff','#2556c9'],['#23c483','#169866'],['#ff9f1c','#d98200'],['#ff6b6b','#d94848'],['#8b5cf6','#6a3fd6'],['#14b8c4','#0e8f99']];
const ALL=[];UNITS.forEach((u,ui)=>u.chapters.forEach((c,ci)=>{c.unit=u;c.idx=ALL.length;c.col=COLORS[ALL.length%COLORS.length];ALL.push(c)}));
const KEY='social-quest-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load()||{xp:0,stars:{},best:{},wrong:{},streakDays:0,lastDay:''};
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LV=[0,60,150,280,450,660,920,1230,1600,2050,2600];
const LVNAME=['새싹 탐험가','꼬마 탐험가','지도 읽는 탐험가','대륙 탐험가','도시 탐정','문화 연구원','기후 박사','정치 새내기','민주 시민','사회 고수','사회 마스터'];
function lvl(){let l=0;while(l<LV.length-1&&S.xp>=LV[l+1])l++;const a=LV[l],b=LV[l+1]||a+500;return{l,name:LVNAME[l],p:Math.min(1,(S.xp-a)/(b-a)),need:b-S.xp}}
function unlocked(i){return i===0||!!S.stars[ALL[i-1].id]}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function touchDay(){const t=today();if(S.lastDay===t)return;const y=new Date(Date.now()-864e5);const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();S.streakDays=S.lastDay===ys?S.streakDays+1:1;S.lastDay=t;save()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}
const totalStars=()=>Object.values(S.stars).reduce((a,b)=>a+b,0);
const MASCOT=`<svg class="mascot" viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="94" rx="26" ry="5" fill="rgba(0,0,0,.15)"/><path d="M22 58c0-22 12-38 28-38s28 16 28 38-12 32-28 32-28-10-28-32z" fill="#ffc531"/><path d="M30 26l6 12M70 26l-6 12" stroke="#e0a500" stroke-width="6" stroke-linecap="round"/><circle cx="39" cy="50" r="11" fill="#fff"/><circle cx="61" cy="50" r="11" fill="#fff"/><circle cx="41" cy="51" r="5" fill="#1d2a4a"/><circle cx="59" cy="51" r="5" fill="#1d2a4a"/><circle cx="43" cy="49" r="1.6" fill="#fff"/><circle cx="61" cy="49" r="1.6" fill="#fff"/><path d="M46 62l4 5 4-5z" fill="#ff6b6b"/><path d="M36 76c8 6 20 6 28 0" stroke="#e0a500" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M28 24h44l-4-10H32z" fill="#3d7bff"/><rect x="24" y="22" width="52" height="5" rx="2.5" fill="#2556c9"/></svg>`;
let tab='map';
/* ---------- 홈 ---------- */
function home(){
 const L=lvl();const done=Object.keys(S.stars).length;
 const curI=ALL.findIndex((c,i)=>unlocked(i)&&!S.stars[c.id]);
 let h=`<div class="top"><div class="chip"><span class="ic">🔥</span>${S.streakDays||0}일</div><div class="chip"><span class="ic">⭐</span>${totalStars()}</div><div class="chip"><span class="ic">💎</span>${S.xp}</div><div class="spacer"></div><button class="icobtn" id="rst" aria-label="처음부터 다시 하기">⚙️</button></div>
 <div class="hero">${MASCOT}<div class="txt"><h1>사회 탐험대</h1><p>Lv.${L.l+1} ${L.name} · ${done}/${ALL.length} 단원 클리어</p><div class="lvbar"><i style="width:${L.p*100}%"></i></div><div class="lvtxt"><span>다음 레벨까지</span><span>${L.l>=LV.length-1?'MAX':L.need+' 점'}</span></div></div></div>
 <div class="tabs"><button class="${tab==='map'?'on':''}" data-t="map">🗺️ 탐험 지도</button><button class="${tab==='note'?'on':''}" data-t="note">📒 오답 노트</button></div>`;
 if(tab==='map'){
  UNITS.forEach((u,ui)=>{const c=u.chapters,cl=c.filter(x=>S.stars[x.id]).length;
   h+=`<section class="unit"><div class="unit-h"><span class="tag" style="background:${ui?'#8b5cf6':'#3d7bff'}">${ui?'정치':'지리'}</span><h2>${esc(u.sub)}</h2><span class="cnt">${cl}/${c.length}</span></div><div class="path">`;
   c.forEach(ch=>{const i=ch.idx,lk=!unlocked(i),st=S.stars[ch.id]||0,cur=i===curI;
    h+=`<button class="node ${lk?'lock':''} ${cur?'cur':''}" data-c="${i}" style="--c:${ch.col[0]};--cd:${ch.col[1]}" aria-label="${esc(ch.title)}${lk?' (잠김)':''}">${cur?'<span class="start">시작!</span>':''}<span class="bub">${lk?'🔒':ch.icon}</span><span class="nm">${esc(ch.title)}</span><span class="stars">${st?'⭐'.repeat(st)+'<span style="opacity:.25">'+'⭐'.repeat(3-st)+'</span>':''}</span></button>`});
   h+=`</div></section>`});
 }else{
  const ids=Object.keys(S.wrong);
  h+=`<section class="unit"><div class="unit-h"><h2>내가 틀렸던 문제</h2><span class="cnt">${ids.length}개</span></div>`;
  if(!ids.length)h+=`<div class="empty">아직 틀린 문제가 없어요.<br>탐험을 시작해 볼까요?</div>`;
  else{h+='<div class="wn">';ids.sort((a,b)=>S.wrong[b].n-S.wrong[a].n).forEach(id=>{const [ci,qi]=id.split(':').map(Number),ch=ALL[ci],q=ch.quiz[qi];
   h+=`<div class="it"><small>${esc(ch.title)} · ${S.wrong[id].n}번 틀림</small><p>${esc(q.q)}</p><div class="a">정답: ${esc(q.t==='ox'?(q.a?'O':'X'):q.o[q.a])}</div><small style="font-weight:600">${esc(q.e)}</small></div>`});h+='</div>';
   h+=`<div style="margin-top:14px"><button class="btn coral" id="wnplay">오답만 다시 풀기 (${Math.min(10,ids.length)}문제)</button></div>`}
  h+='</section>';
 }
 app.innerHTML=h;
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;home()});
 app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const i=+b.dataset.c;if(!unlocked(i)){toast('🔒 앞 단원을 먼저 깨야 해요!');return}startChapter(i)});
 const r=$('#rst');if(r)r.onclick=confirmReset;
 const wp=$('#wnplay');if(wp)wp.onclick=reviewWrong;
}
function confirmReset(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><h3 class="disp" style="font-size:22px">처음부터 다시 할까요?</h3><p style="margin:0;color:var(--muted);font-weight:600">점수, 별, 오답 노트가 모두 지워져요.</p><button class="btn coral" id="y">네, 지울래요</button><button class="btn ghost" id="n">아니요</button></div>`;document.body.appendChild(m);m.querySelector('#n').onclick=()=>m.remove();m.querySelector('#y').onclick=()=>{S={xp:0,stars:{},best:{},wrong:{},streakDays:0,lastDay:''};save();m.remove();tab='map';home()}}
/* ---------- 단원 ---------- */
let R; // run state
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function startChapter(i){touchDay();const ch=ALL[i];R={ch,i,phase:'learn',card:0,opened:new Set(),queue:ch.quiz.map((q,qi)=>({ci:i,qi})),pos:0,wrongSet:[],firstWrong:new Set(),earned:0,combo:0,maxCombo:0,round:1,review:false};learn()}
function reviewWrong(){touchDay();const items=shuffle(Object.keys(S.wrong)).slice(0,10).map(id=>{const [ci,qi]=id.split(':').map(Number);return{ci,qi}});R={ch:null,phase:'quiz',queue:items,pos:0,wrongSet:[],firstWrong:new Set(),earned:0,combo:0,maxCombo:0,round:2,review:true,note:true};quiz()}
function topbar(p,label,col){return `<div class="bar"><button class="x" id="quit" aria-label="나가기">✕</button><div class="prog"><i style="width:${p*100}%"></i></div><div class="chip"><span class="ic">💎</span>${S.xp}</div></div><span class="stage" style="background:${col}">${label}</span>`}
function bindQuit(){$('#quit').onclick=()=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><h3 class="disp" style="font-size:22px">탐험을 멈출까요?</h3><p style="margin:0;color:var(--muted);font-weight:600">지금 단원은 처음부터 다시 해야 해요.</p><button class="btn" id="n">계속할래요</button><button class="btn ghost" id="y">나갈래요</button></div>`;document.body.appendChild(m);m.querySelector('#n').onclick=()=>m.remove();m.querySelector('#y').onclick=()=>{m.remove();home()}}}
function learn(){
 const ch=R.ch,c=ch.cards[R.card];let k=0,total=0;
 const body=c.b.map(t=>'<li>'+esc(t).replace(/\[\[(.+?)\]\]/g,(m,w)=>{const id=R.card+'-'+(k++);total++;const op=R.opened.has(id);return `<button class="blank ${op?'open':''}" data-b="${id}" aria-label="${op?w:'빈칸 열기'}">${w}</button>`})+'</li>').join('');
 const opened=[...R.opened].filter(x=>x.startsWith(R.card+'-')).length;
 app.innerHTML=topbar((R.card+opened/Math.max(total,1))/ch.cards.length*0.35,'📖 개념 익히기 '+(R.card+1)+'/'+ch.cards.length,ch.col[0])+
 `<h2 class="qtitle">${esc(ch.q)}</h2><div class="panel concept"><h3>${esc(c.h)}</h3><ul>${body}</ul></div>
 <div class="hint">${opened<total?`보라색 빈칸을 눌러 정답을 열어 보세요! (${opened}/${total}) · 빈칸 하나에 +1점`:'좋아요! 모든 빈칸을 열었어요 ✨'}</div>
 <div class="dots">${ch.cards.map((_,i)=>`<i class="${i===R.card?'on':''}"></i>`).join('')}</div>
 <div style="display:flex;gap:10px">${R.card?'<button class="btn ghost" id="prev" style="flex:0 0 30%">이전</button>':''}<button class="btn ${R.card===ch.cards.length-1?'sun':''}" id="next" ${opened<total?'disabled':''}>${R.card===ch.cards.length-1?'문제 풀러 가기 🚀':'다음 카드'}</button></div>`;
 bindQuit();
 app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{if(R.opened.has(b.dataset.b))return;R.opened.add(b.dataset.b);S.xp+=1;R.earned+=1;save();learn()});
 $('#next').onclick=()=>{if(R.card<ch.cards.length-1){R.card++;learn()}else{R.phase='quiz';R.queue=shuffle(R.queue);quiz()}};
 const p=$('#prev');if(p)p.onclick=()=>{R.card--;learn()};
 window.scrollTo(0,0);
}
let sel=null,locked=false,curOpts=null;
function quiz(){
 sel=null;locked=false;
 const it=R.queue[R.pos],ch=ALL[it.ci],q=ch.quiz[it.qi];
 const retry=R.round>1;
 const base=R.review?R.pos/R.queue.length:(retry?0.85+0.15*R.pos/R.queue.length:0.35+0.5*R.pos/R.queue.length);
 const label=R.note?'📒 오답 노트 '+(R.pos+1)+'/'+R.queue.length:retry?'🔁 틀린 문제 다시 풀기 '+(R.pos+1)+'/'+R.queue.length:'✏️ 문제 '+(R.pos+1)+'/'+R.queue.length;
 let opts='';
 if(q.t==='ox'){curOpts=[true,false];opts=`<div class="ox"><button class="opt" data-o="0"><span class="o">O</span><small>맞아요</small></button><button class="opt" data-o="1"><span class="xx">X</span><small>틀려요</small></button></div>`}
 else{curOpts=shuffle(q.o.map((t,i)=>({t,i})));opts=`<div class="opts">${curOpts.map((o,i)=>`<button class="opt" data-o="${i}"><span class="k">${i+1}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`}
 app.innerHTML=topbar(base,label,retry?'#ff6b6b':ch.col[0])+
 `<div class="qtag"><span class="b">${q.t==='ox'?'OX 퀴즈':'골라 보기'}</span>${esc(ch.title)}${R.combo>=2?`<span class="combo">🔥 ${R.combo}연속!</span>`:''}</div>
 <h2 class="qtitle">${esc(q.q)}</h2>${opts}<button class="btn" id="chk" disabled>정답 확인</button><div class="padbot"></div>`;
 bindQuit();
 app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(locked)return;sel=+b.dataset.o;app.querySelectorAll('[data-o]').forEach(x=>x.classList.toggle('sel',x===b));$('#chk').disabled=false;if(q.t==='ox')check()});
 $('#chk').onclick=check;
 window.scrollTo(0,0);
}
function check(){
 if(sel===null||locked)return;locked=true;
 const it=R.queue[R.pos],ch=ALL[it.ci],q=ch.quiz[it.qi],id=it.ci+':'+it.qi;
 const ok=q.t==='ox'?(curOpts[sel]===q.a):(curOpts[sel].i===q.a);
 const btns=app.querySelectorAll('[data-o]');
 btns.forEach((b,i)=>{b.classList.remove('sel');const right=q.t==='ox'?curOpts[i]===q.a:curOpts[i].i===q.a;if(right)b.classList.add('good');else if(i===sel)b.classList.add('bad')});
 let gain=0;
 if(ok){R.combo++;R.maxCombo=Math.max(R.maxCombo,R.combo);gain=R.round===1?10+(R.combo>=3?Math.min(10,(R.combo-2)*2):0):5;if(R.note){delete S.wrong[id]}}
 else{R.combo=0;R.wrongSet.push(it);if(R.round===1)R.firstWrong.add(id);S.wrong[id]={n:((S.wrong[id]||{}).n||0)+1}}
 S.xp+=gain;R.earned+=gain;save();
 const ansTxt=q.t==='ox'?(q.a?'O':'X'):q.o[q.a];
 const praise=['정답이에요!','완벽해요!','최고예요!','대단해요!','척척박사!'];
 const sh=document.createElement('div');sh.className='sheet '+(ok?'good':'bad');
 sh.innerHTML=`<div class="in"><h3>${ok?'🎉 '+praise[Math.random()*praise.length|0]+(gain?' +'+gain+'점':''):'😮 아쉬워요! 다시 풀 문제에 담았어요'}</h3><p>${ok?'':`<span class="ans">정답: ${esc(ansTxt)}</span><br>`}${esc(q.e)}</p><button class="btn ${ok?'mint':'coral'}" id="go">${R.pos<R.queue.length-1?'다음 문제':'계속하기'}</button></div>`;
 document.body.appendChild(sh);$('#chk').hidden=true;
 sh.querySelector('#go').focus();
 sh.querySelector('#go').onclick=()=>{sh.remove();next()};
}
function next(){
 R.pos++;
 if(R.pos<R.queue.length){quiz();return}
 if(R.wrongSet.length){ // 틀린 문제가 남아 있으면 다시
  R.queue=shuffle(R.wrongSet);R.wrongSet=[];R.pos=0;R.round++;
  app.innerHTML=`<div class="result" style="padding-top:40px">${MASCOT}<h2 class="disp" style="font-size:28px">틀린 문제를 다시 풀어 봐요!</h2><div class="retry-note">틀린 문제 ${R.queue.length}개를 모두 맞혀야<br>${R.note?'오답 노트를 마칠 수 있어요.':'다음 단원으로 넘어갈 수 있어요.'} 💪</div><button class="btn coral" id="go">다시 도전!</button></div>`;
  $('#go').onclick=quiz;return}
 finish();
}
function finish(){
 if(R.note){app.innerHTML=`<div class="result" style="padding-top:40px">${MASCOT}<h2 class="disp" style="font-size:30px">오답 노트 정복!</h2><p style="font-weight:700;color:var(--muted)">틀렸던 문제를 모두 맞혔어요.</p><div class="stats"><div class="stat"><b>+${R.earned}</b><span>얻은 점수</span></div><div class="stat"><b>${R.maxCombo}</b><span>최고 연속</span></div><div class="stat"><b>${Object.keys(S.wrong).length}</b><span>남은 오답</span></div></div><button class="btn" id="home">탐험 지도로</button></div>`;$('#home').onclick=()=>{tab='note';home()};confetti();return}
 const ch=R.ch,n=ch.quiz.length,w=R.firstWrong.size,correct=n-w;
 const st=w===0?3:w<=2?2:1;const prev=S.stars[ch.id]||0;
 const bonus=st===3?20:st===2?10:5;S.xp+=bonus;R.earned+=bonus;
 S.stars[ch.id]=Math.max(prev,st);save();
 const nxt=ALL[R.i+1];
 app.innerHTML=`<div class="result" style="padding-top:20px">${MASCOT}<h2 class="disp" style="font-size:30px">${st===3?'완벽한 탐험!':'단원 클리어!'}</h2>
 <div class="bigstars">${[0,1,2].map(i=>`<span class="${i<st?'':'off'}" style="animation-delay:${i*.18}s">⭐</span>`).join('')}</div>
 <p style="margin:0;font-weight:700;color:var(--muted)">${esc(ch.title)} · 처음에 ${n}문제 중 ${correct}문제 정답</p>
 <div class="stats"><div class="stat"><b>+${R.earned}</b><span>얻은 점수</span></div><div class="stat"><b>${Math.round(correct/n*100)}</b><span>정답률 %</span></div><div class="stat"><b>${R.maxCombo}</b><span>최고 연속</span></div></div>
 ${st<3?`<div class="retry-note">한 번에 다 맞히면 ⭐ 3개! 언제든 다시 도전할 수 있어요.</div>`:''}
 ${nxt?`<button class="btn sun" id="nx">다음 단원: ${esc(nxt.title)} →</button>`:`<div class="retry-note" style="background:#e6fbf2;border-color:var(--mint);color:#0d5c3d">🏆 모든 단원을 클리어했어요! 오답 노트로 마무리해 봐요.</div>`}
 <button class="btn ghost" id="home">탐험 지도로</button></div>`;
 if(nxt)$('#nx').onclick=()=>startChapter(R.i+1);
 $('#home').onclick=()=>{tab='map';home()};
 confetti();
}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=$('#cf');c.hidden=false;const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#3d7bff','#ffc531','#ff6b6b','#23c483','#8b5cf6'];const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,s:6+Math.random()*6,c:cols[Math.random()*5|0]}));let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++t<160)requestAnimationFrame(f);else{c.hidden=true}})()}
home();
